<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LAN Messenger</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- ავტორიზაციის ეკრანი -->
    <div id="auth-screen">
        <div class="auth-card">
            <div class="auth-header">
                <div class="app-logo">💬</div>
                <h2>LAN Messenger</h2>
                <p>შეიყვანეთ მონაცემები ჩატში შესასვლელად</p>
            </div>
            
            <div class="input-group">
                <input type="text" id="username" placeholder=" " required autocomplete="off">
                <label for="username">მომხმარებელი</label>
            </div>
            
            <div class="input-group">
                <input type="password" id="password" placeholder=" " required>
                <label for="password">პაროლი</label>
            </div>

            <div class="auth-buttons">
                <button type="button" class="btn btn-primary" onclick="login()">შესვლა</button>
                <button type="button" class="btn btn-secondary" onclick="register()">რეგისტრაცია</button>
            </div>
        </div>
    </div>

    <!-- ჩატის ეკრანი -->
    <div id="chat-screen" style="display: none;">
        <header class="chat-header">
            <div class="user-info">
                <div class="user-avatar">👤</div>
                <div>
                    <span id="current-user-display">მომხმარებელი</span>
                    <span class="online-status"><span class="status-dot"></span> ონლაინშია</span>
                </div>
            </div>
        </header>

        <div id="messages" class="messages-container"></div>

        <div class="chat-input-area">
            <div class="media-actions">
                <label for="file-input" class="icon-btn" title="ფოტოს ატვირთვა">
                    📸
                    <input type="file" id="file-input" accept="image/*" style="display: none;">
                </label>
                
                <button type="button" id="voice-btn" class="icon-btn" title="ხმოვანი შეტყობინება">
                    🎙️
                </button>
            </div>
            
            <input type="text" id="message-input" placeholder="ჩაწერთ შეტყობინებას..." onkeypress="if(event.key === 'Enter') sendMessage()">
            
            <button type="button" class="send-btn" onclick="sendMessage()">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                    <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>
                </svg>
            </button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
