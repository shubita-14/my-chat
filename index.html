<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LAN Messenger</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

    <!-- შენი საიტის ტანი / HTML ელემენტები -->
    <div id="auth-screen">
        <!-- ავტორიზაციის ფანჯარა -->
    </div>

    <div id="messages" class="messages-container"></div>

    <div class="chat-input-area">
        <input type="text" id="message-input" placeholder="ჩაწერეთ შეტყობინება...">
        <button type="button" class="send-btn" onclick="sendMessage()">გაგზავნა</button>
    </div>

    <!-- სკრიპტები ბოლოში -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
